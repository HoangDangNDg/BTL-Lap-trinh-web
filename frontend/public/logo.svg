<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <defs>
    <!-- Deep Obsidian Jet Background -->
    <linearGradient id="logo-l-bg" x1="0" y1="0" x2="68" y2="68" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#18181B"/>
      <stop offset="100%" stop-color="#09090B"/>
    </linearGradient>

    <!-- Metallic Silver Rim -->
    <linearGradient id="logo-l-rim" x1="0" y1="0" x2="68" y2="68" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Top Gloss Arc -->
    <linearGradient id="logo-l-shine" x1="34" y1="2" x2="34" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="logo-l-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- ================= LOGO ICON EMBLEM (LEFT) ================= -->
  <g transform="translate(6, 6)">
    <!-- Squircle Obsidian Base (68x68) -->
    <rect x="0" y="0" width="68" height="68" rx="18" fill="url(#logo-l-bg)" filter="url(#logo-l-shadow)"/>
    <rect x="0.5" y="0.5" width="67" height="67" rx="17.5" stroke="url(#logo-l-rim)" stroke-width="1.2"/>
    
    <!-- Top Glass Reflection -->
    <path d="M2 18C2 9.163 9.163 2 18 2H50C58.837 2 66 9.163 66 18C66 23 52 32 34 32C16 32 2 23 2 18Z" fill="url(#logo-l-shine)"/>

    <!-- Haute Couture Luxury Letter L (Bodoni / Didone Italic scaled 1.06) -->
    <g transform="translate(2, 2)">
      <path d="M 31.01 15.08 L 23.14 52.04 L 31.01 52.04 C 33.54 52.04, 35.51 51.81, 36.92 51.34 C 38.33 50.87, 39.64 49.83, 40.85 48.22 C 42.07 46.61, 43.39 44.06, 44.82 40.56 L 46.37 40.56 L 42.82 53.56 L 10.43 53.56 L 10.76 52.04 L 16.31 52.04 L 24.06 15.08 L 18.13 15.08 L 18.45 13.56 L 37.25 13.56 L 36.89 15.08 Z" fill="#FFFFFF"/>

      <!-- Diamond Sparkle Star -->
      <path d="M 48 21 L 49.2 18 L 52 16.8 L 49.2 15.6 L 48 13 L 46.8 15.6 L 44 16.8 L 46.8 18 Z" fill="#FFFFFF" fill-opacity="0.95"/>
    </g>
  </g>

  <!-- ================= TYPOGRAPHY & BRANDING (RIGHT) ================= -->
  <g transform="translate(90, 0)">
    <!-- "Edu" in Bold Jet Black -->
    <text x="0" y="45" font-family="'Plus Jakarta Sans', 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, sans-serif" font-size="32" font-weight="800" fill="#09090B" letter-spacing="-0.03em">Edu</text>
    
    <!-- "Center" in Elegant Deep Graphite -->
    <text x="64" y="45" font-family="'Plus Jakarta Sans', 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, sans-serif" font-size="32" font-weight="600" fill="#3F3F46" letter-spacing="-0.02em">Center</text>
    
    <!-- Luxury Diamond Dot Accent -->
    <path d="M182 25L183.5 22L186 20.8L183.5 19.6L182 17L180.5 19.6L178 20.8L180.5 22L182 25Z" fill="#09090B"/>

    <!-- Tagline in Monospace/Refined Sans -->
    <text x="1" y="63" font-family="'Plus Jakarta Sans', 'Be Vietnam Pro', sans-serif" font-size="9.5" font-weight="600" fill="#71717A" letter-spacing="0.16em">HỆ THỐNG QUẢN TRỊ ĐÀO TẠO</text>
  </g>
</svg>
